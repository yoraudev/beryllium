[package]
name = "beryllium_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "dump"
path = "test/font/dump.rs"

[[example]]
name = "sheet"
path = "test/font/sheet.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
bymsdfgen-core = "0.1.1"
jni = "0.21"
ttf-parser = "0.25.1"
