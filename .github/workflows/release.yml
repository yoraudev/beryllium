name: release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "beryllium-renderer/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build native libraries
        run: |
          docker run --rm -e MACOSX_DEPLOYMENT_TARGET=11.0 -v "$PWD":/io -w /io/native messense/cargo-zigbuild:0.24.1 sh -c '
            cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17 &&
            cargo zigbuild --release --target x86_64-pc-windows-gnu &&
            cargo zigbuild --release --target x86_64-apple-darwin &&
            cargo zigbuild --release --target aarch64-apple-darwin
          '
          sudo chown -R "$(id -u):$(id -g)" native/target
          mkdir -p prebuilt/natives/linux-x86_64 prebuilt/natives/windows-x86_64 prebuilt/natives/macos-x86_64 prebuilt/natives/macos-aarch64
          cp native/target/x86_64-unknown-linux-gnu/release/libberyllium_native.so prebuilt/natives/linux-x86_64/
          cp native/target/x86_64-pc-windows-gnu/release/beryllium_native.dll prebuilt/natives/windows-x86_64/
          cp native/target/x86_64-apple-darwin/release/libberyllium_native.dylib prebuilt/natives/macos-x86_64/
          cp native/target/aarch64-apple-darwin/release/libberyllium_native.dylib prebuilt/natives/macos-aarch64/
          ls -R prebuilt/natives
      - name: compute version
        id: version
        run: |
          base=$(sed -nE 's/^mod_version=([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' gradle.properties)
          last=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${base}.${patch}"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmod_version="$VERSION" -Pnative_resources_dir=prebuilt
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: publish release
        run: gh release create "v${VERSION}" "build/libs/beryllium-${VERSION}.jar" "build/libs/beryllium-renderer-${VERSION}.jar" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}