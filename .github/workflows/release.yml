name: release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "beryllium-renderer/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  natives:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            tag: windows-x86_64
            library: beryllium_native.dll
          - runner: ubuntu-24.04
            tag: linux-x86_64
            library: libberyllium_native.so
          - runner: macos-15-intel
            tag: macos-x86_64
            library: libberyllium_native.dylib
          - runner: macos-15
            tag: macos-aarch64
            library: libberyllium_native.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: build native library
        working-directory: native
        run: cargo build --release
      - name: upload native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: native/target/release/${{ matrix.library }}
          if-no-files-found: error

  release:
    needs: natives
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: download native libraries
        uses: actions/download-artifact@v7
        with:
          path: prebuilt/natives
      - name: compute version
        id: version
        run: |
          base=$(sed -nE 's/^mod_version=([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' gradle.properties)
          last=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${base}.${patch}"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmod_version="$VERSION" -Pnative_resources_dir=prebuilt
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: publish release
        run: gh release create "v${VERSION}" "build/libs/beryllium-${VERSION}.jar" "build/libs/beryllium-renderer-${VERSION}.jar" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}