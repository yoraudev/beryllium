name: release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "beryllium-renderer/**"
      - "native/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: compute version
        id: version
        run: |
          base=$(sed -nE 's/^mod_version=([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' gradle.properties)
          last=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${base}.${patch}"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmod_version="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: publish release
        run: gh release create "v${VERSION}" "build/libs/beryllium-${VERSION}.jar" "build/libs/beryllium-renderer-${VERSION}.jar" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}